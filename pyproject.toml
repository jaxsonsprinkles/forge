[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
requires-python = ">=3.10,<3.14"

[tool.setuptools.packages.find]
include = ["core*", "domains*", "agents*", "evals*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
