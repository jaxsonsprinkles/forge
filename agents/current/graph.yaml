# Baseline general-purpose agent graph: fetch, solve, verify, finalize.
#
# core/proposer.py's "orchestration" mutations edit this file - add,
# remove, or reorder steps. See README.md in this directory for the
# step-type vocabulary run.py's interpreter supports.
#
# The four fetch_* tool_call steps below are github_triage-specific
# (see tools.py) - they read `repo`/`issue_number` straight out of
# task_input, so they're only ever real for that domain. On every other
# domain's task_input they cleanly no-op to a `{"skipped": ...}` value
# (see tools.py's docstring) instead of raising, so they cost nothing
# functionally elsewhere in the graph.
steps:
  - name: fetch_issue
    type: tool_call
    tool: github_get_issue
    args_from: task_input
    output_key: issue

  - name: fetch_repo_labels
    type: tool_call
    tool: github_list_labels
    args_from: issue
    output_key: repo_labels

  - name: fetch_similar_issues
    type: tool_call
    tool: github_search_similar_issues
    args_from: issue
    output_key: similar_issues

  - name: fetch_reporter_activity
    type: tool_call
    tool: github_get_reporter_activity
    args_from: issue
    output_key: reporter_activity

  - name: solve
    type: llm_call
    instruction: >
      Produce your best attempt at the final answer to the task input
      above, in the exact format requested (see your system
      instructions).
    input_keys: [issue, repo_labels, similar_issues, reporter_activity]
    output_key: draft

  - name: check_draft
    type: verify
    check: non_empty
    input_key: draft
    on_fail: solve
    max_retries: 1

  - name: finalize
    type: llm_call
    instruction: >
      Here is your draft answer from the previous step, given as context
      below. Review it once more against the task input and any fetched
      context above, correct any mistakes, and respond with ONLY the
      final answer in the exact format requested - no extra commentary.
    input_keys: [draft, issue, repo_labels, similar_issues, reporter_activity]
    output_key: final
